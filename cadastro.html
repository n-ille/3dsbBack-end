<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastro</title>
</head>
<body>
    <h1>Cadastro de clientes</h1>
    <form id = "form_cadastro">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="Digite seu nome aqui" required>
        <label for="celular">Celular:</label>
        <input type="tel" id="celular" placeholder="(42) 91234-5678" required>
        <label for="cpf">Cpf:</label>
        <input type="text" id="cpf" placeholder="000.000.000-00" required>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="priquitosempena@gmail.com" required>
        <label for = "senha">Senha:</label>
        <input type = "password" id = senha required class = "input-texto">
        <p>Já possui conta?<a href="./login.html"> Fazer login</a></p>


        <input type="submit" id = "btn_enviar" value="Entrar" class="btn_enviar"> 
        </form>

     <script>
        function pegar_dados() {
             const dados = {
                Nome: document.getElementById("Nome").value,
                Celular: document.getElementById("Celular").value,
                Cpf: document.getElementById("Cpf").value,
                Email: document.getElementById("Email").value,
                Senha: document.getElementById("Senha").value,
            }
            return dados
        }
        const form = document.getElementById("form_cadastro")
        const btn_enviar = document.getElementById("btn_enviar")
        form.addEventlistener("submit", async (event) => {
            event.preventDefault()
            btn_enviar.disabled = true
            btn_enviar.value = "enviando..."
            const dados = pegar_dados()
            try{
                 const resposta = await ferch("http://10.216.243.142:3000/cliente",{
                 method: "POST",
                 headers: {"Content-Type": "application/json" },
                 body: JSON.stringfi(dados)
            }
        )
        if (!respota.ok) throw new Error("erro na API")
        alert("o cadastro foi realizado!")
        form.reset()
    }catch (error){
        alert(error)
    } finally {
        btn_enviar.disabled = false
        btn_enviar.value = "enviar cadastro"
    }
})
        </script>
</body>
</html>
